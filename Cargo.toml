[workspace]
resolver = "3"
# The shader and CUDA kernels are `no_std` and build only for their own targets
# (spirv-*, nvptx64) via `cargo gpu` / rustc, so they are not members: a plain
# `cargo build` on the host would try to compile them for x86 and fail. They are
# still in the tree beside the core they share, and their paths resolve.
members = ["crates/pyac", "crates/pyac-vliw-core", "crates/gpu/worker"]
exclude = ["crates/gpu/shader", "crates/gpu/cuda-kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# `undefined_behavior` lints are workspace-wide; `unsafe_code` is not, because
# the answer differs per crate and a workspace lint nobody opts into is a
# guarantee nothing enforces. Each crate states its own:
#
#   pyac, pyac-vliw-worker   #![forbid(unsafe_code)]  — no unsafe at all
#   pyac-vliw-core           #![deny(unsafe_code)] with per-site allowances,
#                            because the GPU path needs unchecked indexing to
#                            avoid bounds checks in the inner loop
[workspace.lints.rust]
unexpected_cfgs = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
