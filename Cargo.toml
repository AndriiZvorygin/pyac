[workspace]
resolver = "3"
# The shader and CUDA kernels are `no_std` and build only for their own targets
# (spirv-*, nvptx64) via `cargo gpu` / rustc, so they are not members: a plain
# `cargo build` on the host would try to compile them for x86 and fail. They are
# still in the tree beside the core they share, and their paths resolve.
members = ["crates/pyac", "crates/pyac-vliw-core", "crates/gpu/worker"]
exclude = ["crates/gpu/shader", "crates/gpu/cuda-kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# No `[workspace.lints]`. A workspace lint only applies to a crate that opts in
# with `[lints] workspace = true`, and none here does — declaring one would
# advertise a guarantee nothing enforces. Each crate states its own instead:
#
#   pyac, pyac-vliw-worker   #![forbid(unsafe_code)]  — no unsafe at all
#   pyac-vliw-core           #![deny(unsafe_code)] with per-file allowances,
#                            because the GPU path needs unchecked indexing
#   pyac-vliw-core           also sets `unexpected_cfgs` with the `spirv`
#                            check-cfg its target detection needs

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
